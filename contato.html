            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="content-section">
            <h1>Entre em Contato</h1>
            <figure class="fig-topo fig-pequena">
                <img src="img/imagem11.jpg" alt="Ilustração de envelope e balão de mensagem" width="800" height="500">
            </figure>
            <form id="formContato" class="contato-form" novalidate>
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="[0-9]{10,11}" inputmode="numeric" title="Digite apenas números (10 ou 11 dígitos)" placeholder="19999998888">
                </div>
                <div class="form-group">
                    <label for="avaliacao">Avalie nosso site (0 a 5):</label>
                    <select id="avaliacao" name="avaliacao" required>
                        <option value="">Selecione...</option>
                        <option value="0">0 - Ruim</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3 - Regular</option>
                        <option value="4">4</option>
                        <option value="5">5 - Excelente</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comentario">Deixe seu comentário:</label>
                    <textarea id="comentario" name="comentario"  minlength="10" placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>
                <p id="msgStatus" class="status" role="status" aria-live="polite"></p>
                <div class="form-botoes">
                    <button type="submit" class="btn">Enviar</button>
                    <button type="button" id="btnLimpar" class="btn btn-secundario">Limpar</button>
                </div>
            </form>
        </section>
    </main>
