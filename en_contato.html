    </header>
    <main class="container">
        <section class="content-section">
            <h1>Contact Us</h1>
            <figure class="fig-topo fig-pequena">
                <img src="img/imagem11.jpg" alt="Illustration of an envelope and a message bubble" width="800" height="500">
            </figure>
            <form id="formContato" class="contato-form" novalidate>
                <div class="form-group">
                    <label for="nome">Name: *Required Field</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email: *Required Field</label>
                    <input type="email" id="email" name="email" required placeholder="youremail@example.com">
                </div>
                <div class="form-group">
                    <label for="telefone">Phone: *Required Field</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="[0-9]{10,11}" inputmode="numeric" title="Enter numbers only (10 or 11 digits)" placeholder="19999998888">
                </div>
                <div class="form-group">
                    <label for="avaliacao">Rate our site (0 to 5): *Required Field</label>
                    <select id="avaliacao" name="avaliacao" required>
                        <option value="">Select...</option>
                        <option value="0">0 - Poor</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3 - Average</option>
                        <option value="4">4</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comentario">Leave your comment:</label>
                    <textarea id="comentario" name="comentario"  minlength="10" placeholder="Write your message here..."></textarea>
                </div>
                <p id="msgStatus" class="status" role="status" aria-live="polite"></p>
                <div class="form-botoes">
                    <button type="submit" class="btn">Send</button>
                    <button type="button" id="btnLimpar" class="btn btn-secundario">Clear</button>
                </div>
            </form>
        </section>
    </main>
